pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // Xposed API 82 is not hosted on Google Maven or Maven Central.
        // Appodeal hosts the legacy artifact; keep the Xposed repository
        // and Aliyun mirror as fallbacks.
        maven { url 'https://artifactory.appodeal.com/appodeal-public/' }
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://maven.aliyun.com/repository/public/' }
    }
}

rootProject.name = 'QQEmojiReply-Xposed'
include ':app'